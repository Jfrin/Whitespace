[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "whitespace"
version = "0.1.0"
description = "Mine player demand from public sources, cluster it into niches, score supply gaps."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6",
    "scrapling>=0.4",  # parser only; fetchers live in the `scrape` extra
]

[project.optional-dependencies]
scrape = ["scrapling[fetchers]>=0.4"]   # run `scrapling install` for browsers (see Dockerfile)
llm = ["anthropic>=0.40"]
ml = ["numpy", "sentence-transformers", "umap-learn", "hdbscan", "bertopic"]
dashboard = ["streamlit>=1.35", "pandas"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[project.scripts]
whitespace = "whitespace.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=whitespace --cov-report=term-missing --cov-fail-under=75"
markers = ["network: hits the real network (deselected by default)"]

[tool.coverage.run]
omit = ["src/whitespace/serve/*", "src/whitespace/cluster/embed.py"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
