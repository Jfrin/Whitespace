name: Pipeline (manual)
# TODO before enabling a schedule: persist data/whitespace.sqlite between runs (R2/S3, a data
# branch, or a private HF dataset). Without it, cursors reset and every run re-fetches.
# Artifacts on PUBLIC repos are public, so keep this repo private or push elsewhere.
on:
  workflow_dispatch:
    inputs:
      source:
        description: Source to ingest (as named in config/sources.yaml)
        default: steam_reviews
  # schedule:
  #   - cron: "0 3 * * 1"   # Mondays 03:00 UTC

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      WHITESPACE_CONTACT: ${{ secrets.WHITESPACE_CONTACT }}
      REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
      REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - name: Build prod image
        run: docker build --target prod -t whitespace-prod .
      - name: Run stages
        run: |
          mkdir -p data && sudo chown 1000:1000 data
          run() { docker run --rm -e WHITESPACE_CONTACT -e REDDIT_CLIENT_ID -e REDDIT_CLIENT_SECRET \
                    -v "$PWD/data:/app/data" whitespace-prod "$@"; }
          run ingest "${{ inputs.source }}"
          run clean
          run stats
      - uses: actions/upload-artifact@v4
        with:
          name: whitespace-data
          path: data/whitespace.sqlite
          retention-days: 7
